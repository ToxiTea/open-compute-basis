name: refresh-status
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TECHNOCORE_PUBLISH: "false"
      FLOP_PARTICIPATION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: refresh STATUS.txt
        run: |
          ocb run --live || ocb run --fixtures
          ocb report --out STATUS.txt
      - name: commit STATUS.txt if it changed
        run: |
          git config user.name "ocb-status"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.txt
          git diff --cached --quiet || git commit -m "Refresh STATUS.txt"
          git push
