# Narrow series only. Never mix SKU, interconnect, service class, or pricing type.

OCB-H100-SXM-OD-GLOBAL:
  family: datacenter
  gpu: H100
  interconnect: SXM
  pricing_type: ON_DEMAND
  service_class: MANAGED_CLOUD
  geography: GLOBAL
  include_model_substrings:
    - "H100"
    - "H100 SXM"
    - "H100 SXM5"
    - "NVIDIA H100 SXM5"
    - "H100 80GB HBM3"
    - "H100 80GB HBM"
  include_unspecified_family: true
  unspecified_flag: VARIANT_UNSPECIFIED
  exclude_model_substrings:
    - "NVL"
    - "PCIE"
    - "PCIe"
    - "4090"
    - "H200"
    - "B200"
    - "A100"

