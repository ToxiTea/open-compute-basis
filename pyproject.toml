[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-compute-basis"
version = "0.1.0"
description = "Independent, reproducible GPU compute-basis observations and FLOP session basis."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Open Compute Basis contributors" }]
dependencies = [
  "cryptography>=43.0.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
ocb = "open_compute_basis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
